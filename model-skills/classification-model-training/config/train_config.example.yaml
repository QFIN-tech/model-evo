# classification-model-training 配置模板
# 复制为 <session_dir>/new-models/{algo}-v{N}/config/train_config.yaml 并填真实值
# (放 model 内部 config 目录, 不要放 <skill_dir>/config/ 或 session 根目录)。
# 安全红线: 严禁在任何字段硬编码用户ID/手机号/身份证号。
#
# 本 skill 直接读上游 feature-analysis 产出的切分数据:
#   <session_dir>/sample-features/splits/{train,test,oot}.parquet
# 切分逻辑收口在 feature-analysis (按其 yaml model.split 区间切分),
# 本 skill 不做内部切分, 也不消费 model.split 字段。
# 取数字段(sample_table/fetch_dt/where/spark 段)属于上游 feature-matching 的配置范畴,
# 不在本 skill 的最小配置内; 如仍在本 yaml 中保留仅为上下文追溯, 本 skill 均不消费。

model:
  name: inner_will            # 模型名(用于最终产物命名前缀 {name}_{version}_{ts})
  version: v1
  algo: xgb                   # 算法: xgb(默认,.json) | dnn(MLP,.pkl) | lr(WoE评分卡,.pkl)
  run_label: null             # 本次 run 的版本标识, 用作 new-models/ 下目录后缀({algo}{suffix}-{run_label});
                              # 仅填纯版本号(如 v1 / v2 / custom-tag / 20260710), 不要带 algo/suffix 前缀
                              # (`xgb-v1` / `lgb-v1` / `tuned-v1` / `feat` 会被 validate_config 拒绝,
                              # 因为会与目录规则叠加产生 `xgb-xgb-v1` / `xgb-tuned-tuned-v1` / `xgb-feat` 重复前缀);
                              # 留空且 CLI 未传 --version / --label 时, run_build 自动按 algo+suffix 维度自增(v1→v2...)
  # ⚠️ local_file 模式必填这两行, 否则 validate_common 按默认 spark 强索 sample_table/fetch_dt 报错:
  #   mode: local_file
  #   sample_table: local_file
  mode: spark                 # 取数模式: spark(默认) | local_file(本地 parquet, 跳过 spark 取数)
  sample_table: your_db.xxx  # spark 模式必填(库.表); local_file 模式填 local_file 占位
  dt_col: pday                # 日期分区字段(YYYYMMDD 8位; 用于评估报告展示; 切分由 feature-analysis 负责)
  label_col: label            # 标签字段(0/1)
  id_cols: [user_id]          # 去重/落盘用, exclude_cols 排除, 不入模

  features: []                          # 默认全量特征(留空走 feature_list_source, 如 model-knowledge/assets/feature-knowledge/feature-list/feature-list-user-operation-v1.csv);
                                        # 特征筛选是 classification-model-tuning 的职责, 本 skill 不做
  feature_list_source: null             # 显式给 csv/txt 路径(csv 取 feature_name 列); 相对路径先按本 yaml 所在目录解析, 再按 model-skills 根解析; 可从 feature-knowledge.md 索引查各业务域清单
                                        # ⚠️ local_file 模式下 features 与 feature_list_source 都留空会触发 xgb "0 feature" 报错, 必须二选一填实

  baseline_eval_dir: null     # 基线模型评估目录(如 model-recommend/yx_001/evaluation/);
                              # 配置后, 训练完成自动与基线做 N-way 对比, 产 comparison/ 子目录;
                              # null = 跳过对比

  # 边界特征过滤(剔除会让训练失败或泄漏的特征)
  # 4 条规则: constant(常量) / leakage(IV 过高, 特征穿越) / id_like(unique/count 高) / all_missing(全缺失)
  # 任一规则剔除的特征会落 features/used-feature-list.csv 的 dropped_<rule> 行 + features/report.md 边界过滤段
  # 上游 feature-analysis 缺 stats.csv/feature-quality.csv 时跳过对应规则, 不阻断训练
  boundary_filter:
    enable_constant: true
    enable_leakage: true
    enable_id_like: true
    enable_all_missing: true
    iv_max: 1.0                  # IV > 1.0 视为泄漏
    const_unique_max: 1          # unique <= 1 视为常量
    id_like_ratio: 0.9           # unique / sample_total > 0.9 视为 ID 类
    missing_max: 1.0             # missing_rate >= 1.0 视为全缺失

  # 切分配置已移至 feature-analysis skill (其 yaml model.split 必填)。
  # 本 skill 读 feature-analysis 产出的 splits/{train,test,oot}.parquet, 不消费 model.split 字段。
