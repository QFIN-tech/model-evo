# ModelEvo skill 级配置；产品版本由 runtime.__version__ 单一提供
modelevo:

  baseline:
    algorithms: [xgboost]            # v2.17.0:配置即事实(旧 v2.15 在 cmd_baseline 内存里
                                     # 静默收缩 [lightgbm, xgboost] → [xgboost],已删除);
                                     # 需要 lightgbm 对照时显式加上。深度学习可加 mlp(torch;GPU 优先)。
    skip_algorithms: []              # v2.17.0:显式排除的算法(stdout 留痕)
    anchor_algorithm: null           # v2.17.0:锚点算法(null = 含 xgboost 时取 xgboost)
                                     # v17.4:GBDT 也 GPU 优先(scheduler 注入
                                     # MODELEVO_GPU;模板行数≥2000 自动
                                     # device=cuda,lightgbm 非 GPU 轮 fit 期回退)
    max_trials: 2
    n_estimators_cap: 2000            # v8:早停前轮数上限(GBM 配 eval_set)
    early_stopping_rounds: 50         # v8:早停耐心轮数
    early_stop_validation_fraction: 0.1  # v12/P0-4:train 尾部切 es_valid 占比(仅 train_tail 模式)
    parallel: true                    # v2.13.5:多算法 baseline 按调度并行

  training:
    early_stop_source: validation     # v2.16.0:validation = outer validation 早停、100% train 只训一次;
                                      # train_tail = v2.15 两段式(train 尾部早停 + 全量重拟合)
    early_stop_eval_rows: 150000     # v2.17.3:早停集行数上限(0=不降采样;只影响"何时停")

  evolution:
    max_generations: 8
    max_trials: 80
    parallel_trials: auto
    strategy: archive_evolution
    explore_ratio: 0.4                # v12/P1-9:特征/hpo/交叉 40/40/20
    exploit_ratio: 0.4
    crossover_ratio: 0.05             # v18/P2-2:0.2→0.05(历史 run 0 使用、
                                      # 净贡献为负;语义=accepted 特征族并集重训)
    archive_size: 12
    # v16/P0-2:compute 口径预算(可选)——max_compute_hours 配置时参与
    # 停止判定(Σ trial runtime ≥ 上限 → budget_compute);wall 仍是
    # 绝对上限护栏。缺省不启用,由 spec resource_budget.max_compute_hours
    # 按任务配置。实测背景:120w run 32.1h 墙钟含 19.4h 空闲,计算仅
    # 3.7h 却被 wall 预算判停(pause-blind)。
    # max_compute_hours: 24
    heavy_trials:                      # v7:特征重建/聚合重做配额(data_view)
      min_per_generation: 1            # 每代至少 1 个 heavy(连续两代未投则强制 2)
      max_per_generation: 2
      timeout_multiplier: 4            # heavy trial 超时 = trial_timeout × 4
      runtime_hint_minutes: 30         # Planner 排程参考(单 trial 预期)
    hpo:                               # v11:hpo 动作(inner-split 搜索)
      default_budget: 40               # --budget-configs 缺省(inner 评估数)
      inner_fraction: 0.2              # train 时间序尾部 inner-valid 占比
      timeout_multiplier: 4            # v16:hpo 重活超时放大(与 heavy 同机制)
      max_timeout_minutes: 480         # HPO 独立绝对超时上限
      # v2.15.0 HPO 引擎(req-t7-rand400w run3 三轮复盘;new-trial 的
      # --hpo-* 开关可逐 trial 覆写)
      lr_mode: auto                    # auto | search | shrink:shrink=固定 search_lr
                                       # 搜结构/正则,重训 lr×factor、cap×1/factor;
                                       # auto=inner 行数 ≥ lr_shrink_min_rows 时 shrink
      search_lr: 0.05
      lr_shrink_factor: 0.25           # 重训 lr = 0.05×0.25 = 0.0125
      lr_shrink_min_rows: 200000
      lr_floor: 0.005                  # search 模式边界外扩时 lr 的硬下界
      auto_expand: true                # 前 5 名贴边时同 trial 内外扩该维并续搜
      warm_start: true                 # 复用 inner 签名一致的历史 HPO 观测
      parallel_configs: auto           # inner 并行 config 数(auto:GPU xgboost=2)
      fidelity: single                 # single | successive_halving(1/9→1/3→1)
    max_confirm_attempts_per_recipe: 2 # v2.14.0:每配方 confirm 完成次数上限
                                       # (防"失败就再抽";超额须 new-trial
                                       # --allow-extra-confirm "<理由>")
    min_feature_generations: 2         # v12/P2:特征探索预算 1→2 代(唯一护城河)

  execution:
    trial_timeout_minutes: 90
    kill_grace_period_sec: 30
    max_retries_per_trial: 1
    max_fix_rounds_per_trial: 2
    parallel_trials_auto_cap: 24         # v14.3:单 trial 独占时每 trial 线程上限(见 scheduler)
    threads_floor: 8
    require_clean_gpu: false            # v2.17.3:true = 无干净卡时降级 CPU(不与其它 run 共享)
    min_free_gpu_gb: 20                 # v2.17.3:显存硬门槛(GB)                     # v2.11:线程下限(高负载期不再压到 4——
                                         # 实测 threads=4 的 smoke 跑 1401s,trial
                                         # 白白进入必然超时区;scheduler 与降配同口径)
    failure_circuit_breaker:
      consecutive_failures: 3
      generation_failure_rate: 0.5
    # v2.17.0:内存准入(启动训练前排队,防同机内存争用 OOM;日志 logs/admission.jsonl)
    memory_admission: true             # false = 关闭(诊断也可用环境变量 MODELEVO_MEMORY_ADMISSION=0)
    memory_safety_margin_gb: 60        # 准入后仍须留给同机其它进程的余量
    memory_estimate_default_gb: 64     # 无历史峰值时的单 trial 估计(数据面存在时取 min(本值, 数据面×4))
    admission_poll_sec: 30             # 排队复查间隔
    admission_max_wait_min: 120        # 等满 → FAILED(admission_timeout,infra 类,不记方向负奖励)

  gen_executor:
    halving_enabled: false             # v18/P2-1:默认关(与流水线互斥,0 使用);
                                       # run-generation barrier 模式下显式开回
    halving_ratio: 0.33                # quick 轮训练样本比例
    halving_budget_fraction: 0.3       # quick 轮时间预算占比
    halving_min_trials: 4              # 少于该数不启用
    halving_survive_fraction: 0.5      # quick 轮晋级比例

  evaluator:
    bootstrap: true
    bootstrap_samples: 2000            # v12/P0-2:200→2000(200 次分位数分辨率不足)
    segment_bins: 10                   # 分桶数(§9 分群报告)
    segment_monotonic_threshold: 0.8   # 分桶单调性阈值
    shadow_test_enabled: true
    shadow_policy: confirmation_only    # 普通搜索不读，仅 confirm 独立确认
    shadow_gap_multiplier: 2.0         # v8:shadow gap ≤ multiplier×noise 判 passed
    shadow_gap_relative_max: 0.15      # v8:noise 缺失时的相对 gap 兜底阈值
    final_test_feedback: false
    selection_shrinkage: 1.0           # v12/P0-3:冠军收缩分 metric − k·noise
    generation_fdr_q: 0.10             # 同代提升主张的 BH 上限
    online_alpha_budget: 0.10          # 跨代 alpha spending 总预算
    minimum_meaningful_improvement: 0.001  # 候选价值上界低于此值才可判穷尽
    # v2.17.0:以下四键在此保持旧口径;新 init 的 run 由 cmd_init 写入新口径
    # (runtime/protocol_gates.V2_17_0_RUN_CONFIG:relative=0.0008 / anchor /
    # iut / uniform),在途 run 不换尺。语义见 runtime/config.py DEFAULTS。
    minimum_meaningful_improvement_relative: null  # 量纲感知 MDE 相对系数
    promotion_reference: parent        # parent | anchor(晋级对照)
    crossover_parent_test: first_parent  # first_parent | iut
    alpha_schedule: uniform            # uniform | lord(LORD++)
    anchor_parent_guard_p: 0.05        # anchor 模式:vs_parent p_better 须 > 该值
    lord_horizon: null                 # LORD γ 归一视界(null = max_generations)
    lord_w0_ratio: 0.5                 # LORD 初始财富 W0 = ratio × alpha 预算
    # v2.14.0 确认门(runtime/confirmation.py):非劣 + 保真,margin 含 seed 方差
    #   sd = sqrt(SE² + σ_seed²·(1+1/n_child));σ_seed: multi-seed → 同配方
    #   复现组(df≥2)→ confirm_seed_sd_prior → floor_ratio×SE
    confirm_margin_z: 2.0              # 非劣下界 Δ_dir ≥ −z·sd
    confirm_fidelity_z: 4.0            # 保真上界 Δ_dir ≤ +z·sd(防借 confirm 换配方)
    confirm_seed_sd_floor_ratio: 1.0   # σ_seed 下限 = ratio×SE
    confirm_seed_sd_prior: null        # 已知 seed sd 时可显式给先验
    confirm_reference_check: true      # 子代 vs 父代的参照在 shadow 上不得显著更差
    confirm_stability_mde_ratio: 0.5   # confirm 稳定性门 = max(2·noise, ratio×MDE)
    delivery_divergence_tolerance: null  # 陈旧确认可替代搜索冠军的最大差距(null=MDE)
    require_confirmation: true           # v2.15.8 恢复默认 true:交付必须是 fresh-confirmed 冠军(v2.14.0 确认门);
                                       # false = 豁免交付(搜索冠军直接重训进交付位,delivery_status=confirmation_waived)
    slice_alpha: 0.05                  # v12/P1-5:切片门多重比较校正 z_{1-α/k}
    noise_thresholds:                  # 噪声带判定(§8 promising/validated)
      promising_ratio: 0.5
      validated_ratio: 1.0
    group_importance_repeat: 2         # v2.17.3:5→2(仅方向初筛;单次置换 std 恒 0)
    group_importance_workers: 4        # 分组置换并行 worker
    group_importance_sample_rows: 200000  # v2.13.5:超过该行数时分层抽样;0=全量
    group_importance_policy: skip_rejected  # v2.15.9:默认跳被拒 trial;all|auto|skip_model_only 仍可显式
                                       # | all | skip_rejected | skip_model_only

  profile:
    compression_audit_enabled: true    # v8:信息压缩检测(data_view 候选)

  feature_exploration:                 # v10:特征优先演进;v10.2 超级 trial
    # [v2.13.2] 逐键标注实现状态:IMPLEMENTED=有代码消费,改它有效;
    # RESERVED=无实现,改它**不会**生效(诚实标注,不是待办)。
    enabled: true                      # RESERVED:旧"模型/特征混排"流程已移除,本键恒真
    max_sample_rows: 200000            # IMPLEMENTED:write-splits-sample --max-rows 缺省值
    min_generations: 2                 # IMPLEMENTED:特征期门(v2.16.0):完成代数不足时拒 model/loss/hpo;0=关闭
    converge_generations: 1            # RESERVED:对应充分性门,该门无 runtime 实现
    super_trial: false                 # IMPLEMENTED(v2.13.2):true 时产出 screening-only 宽面初筛
    bundle_beam_width: 4               # IMPLEMENTED(v2.13.2):每代特征 trial 槽位总数(screening 计入)
    conditional_ablation: true         # RESERVED(v2.13.2):runtime 无实现,消融由 Agent 手建 trial
    ablation_trials: 2                 # RESERVED:同上
    # v2.17.0(WP5b):流式数据视图 / 抽样面噪声预检
    view_stream_max_mem_gb: null       # IMPLEMENTED:write-splits-view 流式内存上限(GB);--max-mem-gb 覆盖
    view_stream_chunk_rows: 200000     # IMPLEMENTED:流式块行数缺省(--chunk-rows 覆盖)
    view_full_fallback_max_gb: 8       # IMPLEMENTED:build_view 非行内变换时,估算全量内存 ≤ 该值才回退全量模式
    sample_precheck_max_full_minutes: 30  # IMPLEMENTED:噪声预检的 baseline 全量时长阈值(分钟)
    sample_precheck_n_boot: 200        # IMPLEMENTED:噪声预检 bootstrap 次数

  ensemble:
    enabled: false

  # v2.18.0:中心化经验库(docs/MODELEVO_V2_18_0_EXPERIENCE_LIBRARY_DEV_20261027.md §8.3)
  # 客户端键可被 MODELEVO_LIBRARY_URI / _NS / _TEAM / _ENABLED 环境变量覆盖。
  # 优先级(高→低):环境变量 > 本 run 的 modelevo-config.yaml 的 library.* > 本文件。
  # 注:run 级那段由 init 一并写出,**会覆盖本文件**(v2.18.3 前被静默忽略)。
  library:
    enabled: true                        # false = 本 run 主动禁用经验库:不连服务、
                                         # 不读本机缓存、不固化视图、不做 warm-start
    uri: http://127.0.0.1:18765          # 正式 run 只走服务(Q33)
    namespace: prod                      # 组织/团队 + prod/dev/test(Q13)
    team: ""
    timeout_sec: 15
    cache_dir: ""                        # 读缓存;空 = ~/.cache/modelevo-library
    service:                             # modelevo library serve 使用
      root: /data/oceanus_share/modelevo-library
      db_url: ""                         # 空 = sqlite:///{root}/library.db(仅服务进程打开,Q39)
      artifacts_url: ""                  # 空 = file://{root}/cas
      host: 127.0.0.1                    # Q44:跨机器接入前只听本机
      port: 18765
      backup_keep_days: 30
      python: ""                         # 装有 fastapi/uvicorn 的解释器;空 = 当前解释器
      browse: true                       # 明文镜像 {root}/browse/<namespace>,写入后自动重新生成(只读)
