# v2.18.0 ModelEvo 经验库:团队 / 公司级部署样例(服务 + PostgreSQL + MinIO)
# 在 skill 根目录执行:docker compose -f service/docker-compose.yaml up -d
# 客户端配置:library.uri = http://<host>:18765
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: modelevo
      POSTGRES_PASSWORD: modelevo
      POSTGRES_DB: modelevo_library
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelevo -d modelevo_library"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: modelevo
      MINIO_ROOT_PASSWORD: modelevo-secret
    volumes: ["miniodata:/data"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 modelevo modelevo-secret; do sleep 1; done;
             mc mb --ignore-existing local/modelevo-library"

  library:
    build:
      context: ..
      dockerfile: service/Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    environment:
      LIBRARY_DB_URL: postgresql+psycopg://modelevo:modelevo@postgres:5432/modelevo_library
      LIBRARY_ARTIFACTS_URL: s3://modelevo-library/cas
      AWS_ACCESS_KEY_ID: modelevo
      AWS_SECRET_ACCESS_KEY: modelevo-secret
      FSSPEC_S3_ENDPOINT_URL: http://minio:9000
    volumes: ["libdata:/var/lib/modelevo-library"]
    ports: ["18765:18765"]

volumes:
  pgdata: {}
  miniodata: {}
  libdata: {}
